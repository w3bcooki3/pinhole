name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run typecheck:web
      # Unit tests, all fixtures, collector tests (including the CloudShell
      # script against a fake AWS CLI; jq is preinstalled on ubuntu-latest).
      - run: npm test
      - name: README fixture count is current
        run: node scripts/fixture-count.mjs --check
